version: 2

updates:
  # the versions of the actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # the dependencies of the Chrome extension (development only: nothing is shipped but the bundles)
  - package-ecosystem: npm
    directory: /ChromeExtension
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet: move both together
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # the pipeline and the README say Node 22: the types must follow the Node that runs the code, not the newest one
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
