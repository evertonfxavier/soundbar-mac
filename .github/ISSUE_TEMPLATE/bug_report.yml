name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? **Do not report it here.** Use *Security > Report a vulnerability* (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Meet call in Chrome and a video on YouTube
        2. Lower the slider of the YouTube tab
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      multiple: true
      options:
        - App volume (per app slider or mute)
        - Chrome tab (extension)
        - Microphone
        - Menu bar icon or interface
        - Permission (System Audio Recording)
        - Install or update
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SoundBar version
      description: From the release you installed, e.g. v0.1.3.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.2, Apple silicon
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and sites involved
      description: Only if it is about the extension.
      placeholder: Chrome 131, meet.google.com
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        For crashes or taps that fail: `log show --last 5m --predicate 'process == "SoundBar"' --style compact`.
        Remove anything private (tab titles show up in some logs).
