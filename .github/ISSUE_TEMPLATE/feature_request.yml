name: Feature request
description: An idea for SoundBar
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation first, the solution after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SoundBar to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to try making this change myself
