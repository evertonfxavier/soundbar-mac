<?xml version="1.0" encoding="UTF-8"?>
<!--
  SoundBar Bridge icon, small-size variant (toolbar: 16px and 32px). The same three faders as
  icon-extension.svg, redrawn for a tiny grid: the art fills the canvas, the bars are thicker and the
  knobs have no centre dot (it would be less than a pixel). Rendered by scripts/make-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2BD9C5"/>
      <stop offset="0.5" stop-color="#0D9BD8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#bg)"/>

  <g fill="#FFFFFF">
    <rect x="25" y="24" width="18" height="80" rx="9" fill-opacity="0.34"/>
    <rect x="25" y="46" width="18" height="58" rx="9"/>
    <circle cx="34" cy="46" r="15"/>

    <rect x="55" y="24" width="18" height="80" rx="9" fill-opacity="0.34"/>
    <rect x="55" y="80" width="18" height="24" rx="9"/>
    <circle cx="64" cy="80" r="15"/>

    <rect x="85" y="24" width="18" height="80" rx="9" fill-opacity="0.34"/>
    <rect x="85" y="36" width="18" height="68" rx="9"/>
    <circle cx="94" cy="36" r="15"/>
  </g>
</svg>
